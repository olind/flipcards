<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip cards: glosor</title>
<style>
  /* Fonts and PDF maker live in vendor/, so the page works without internet. */
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("vendor/AtkinsonHyperlegible-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("vendor/AtkinsonHyperlegible-Bold.ttf"); font-weight: 700; }
  /* Andika has the phonetic symbols (ə, ɪ, ˈ ...) that Atkinson Hyperlegible lacks. */
  @font-face { font-family: "Andika"; src: url("vendor/Andika-Regular.ttf"); font-weight: 400; }

  /* Layout: settings panel on the left, true-size A4 sheet preview on the right; print shows only the sheets. */
  :root {
    --ink: #1f2a37;
    --muted: #6b7686;
    --paper: #ffffff;
    --ground: #eef1f5;
    --accent: #2f6fd6;
    --accent-soft: #e3ecfb;
    --line: #9aa5b4;
    --body: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
    --ipa: "Andika", "Lucida Grande", "Arial Unicode MS", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.45 var(--body); }

  .app { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 34px; padding: 24px; align-items: start; }
  .panel { background: var(--paper); border-radius: 10px; padding: 20px; display: grid; gap: 16px; position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; }
  /* Phones and portrait tablets: one column, and the panel scrolls with the page so its buttons are always reachable. */
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 24px; }
    .panel { position: static; max-height: none; overflow: visible; }
  }
  h1 { font: 700 24px/1.1 var(--body); margin: 0; }
  h2 { font: 700 16px/1.2 var(--body); margin: 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }
  label { display: grid; gap: 6px; font-weight: 700; font-size: 13px; }
  textarea, input[type=text], select { font: 15px/1.4 var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 220px; resize: vertical; }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 14px; }
  .status { font-size: 13px; color: var(--muted); }
  .status b { color: var(--ink); }
  .warn { color: #b4441c; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .primary { font: 700 16px var(--body); background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px; }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: .6; cursor: progress; }
  .secondary { background: none; border: 0; color: var(--accent); font-size: 13px; padding: 0; margin-top: -8px; text-decoration: underline; }
  .secondary + .hint { margin-top: 2px; }
  label .hint { font-weight: 400; }
  .center { text-align: center; }
  hr { border: 0; border-top: 1px solid #d5dbe3; margin: 0; width: 100%; }
  .sign { width: 50%; justify-self: center; }

  .preview { display: grid; gap: 20px; justify-items: start; zoom: 0.62; }
  @media (max-width: 860px) { .preview { zoom: 0.42; } }
  @media (max-width: 400px) { .preview { zoom: 0.36; } }
  .sheet-label { font: 700 22px var(--body); color: var(--muted); width: 210mm; margin-bottom: -12px; }

  /* A4 sheet */
  /* On screen the sheet shows the whole A4 page with its 15mm margin; in print the browser adds that margin via @page. */
  .sheet { width: 210mm; height: 297mm; background: var(--paper); padding: 15mm; box-shadow: 0 2px 10px rgba(31,42,55,.15); overflow: hidden; }
  .grid { width: 100%; height: 100%; display: grid; }
  .card { outline: 0.25mm dashed var(--line); position: relative; overflow: hidden; }
  .card.empty { outline-color: transparent; }
  /* Pronunciation and word sit together as one block; its centre height is set per side (TEXT_Y). */
  .text { position: absolute; left: 7mm; right: 7mm; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 1.5mm; text-align: center; }
  .word { font-family: var(--body); font-weight: 700; line-height: 1.15; letter-spacing: 0.08em; white-space: nowrap; }
  .ipa { font-family: var(--ipa); color: var(--muted); line-height: 1.15; white-space: nowrap; }
  .tag { position: absolute; font: 700 7pt var(--body); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .tag.set { bottom: 2.5mm; right: 3mm; text-transform: none; letter-spacing: 0; }

  @page { size: A4 portrait; margin: 15mm; }
  @media print {
    body { background: #fff; }
    .app { display: block; padding: 0; }
    .panel, .sheet-label { display: none; }
    .preview { zoom: 1; display: block; }
    /* 180 x 267mm fits inside the 15mm page margin; a few mm less so rounding never spills onto an extra page. */
    .sheet { width: 180mm; height: 262mm; padding: 0; box-shadow: none; break-after: page; }
    .sheet:last-child { break-after: auto; }
    .card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="app">
  <form class="panel" id="settings" onsubmit="return false">
    <h1>Flip cards: glosor</h1>
    <p class="hint">Generates flip cards from a word list. You can draw images on each card to help memorize.</p>
    <label for="words"><span>Word list<br><span class="hint"><i>English - Swedish</i></span></span>
      <textarea id="words" spellcheck="false"></textarea>
    </label>

    <label class="check" for="showipa"><input type="checkbox" id="showipa" checked> Add British pronunciation where possible</label>
    <label for="setname">Labels (optional)
      <input type="text" id="setname" placeholder="e.g. Week 41">
    </label>
    <label for="perpage">Cards per page
      <select id="perpage">
        <option value="8">8</option>
        <option value="12">12</option>
        <option value="16" selected>16</option>
      </select>
    </label>
    <div class="status" id="status"></div>
    <button type="button" class="primary" id="pdf">Download PDF</button>
    <div class="center">
      <button type="button" class="secondary" id="print">Or print from browser</button>
      <p class="hint">Can mess up the margins on the cards</p>
    </div>
    <hr>
    <img class="sign" src="glhf-ola.png" alt="GLHF, Ola">

  </form>
  <main class="preview" id="preview"></main>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script>
const SAMPLE = `seat belt- säkerhetsbälte
pavement – trottoar
roundabout – rondell
generous – generös
sharp – vass
embarrassing – pinsam
ask for directions – fråga efter vägen
enormous – enorm
famous – känd
celebrity- kändis
traffic lights – trafikljus
pedestrian – fotgängare
bicycle – cykel
crossroads – vägkorsning
dangerous – farlig
careful – försiktig`;

const LAYOUTS = { 8: [2, 4], 12: [3, 4], 16: [4, 4] };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function store(key, val) { try { localStorage.setItem("flipcards." + key, val); } catch (e) {} }
function load(key) { try { return localStorage.getItem("flipcards." + key); } catch (e) { return null; } }

// vendor/ files load when the page is served (e.g. GitHub Pages); a page opened straight from disk can't fetch them, so fall back to the web.
async function fetchLocalFirst(local, remote) {
  try { const r = await fetch(local); if (r.ok) return r; } catch (e) {}
  const r = await fetch(remote, { signal: AbortSignal.timeout(10000) });
  if (!r.ok) throw new Error(r.status);
  return r;
}

// Split "english – svenska" on the first separator. En/em dash, colon, tab or "=" win over a plain
// hyphen, and a plain hyphen only counts when it touches a space, so "well-known – välkänd" stays intact.
function parseLine(line) {
  line = line.trim();
  if (!line) return null;
  let m = line.match(/^(.+?)\s*(?:[–—:=\t]|\s-\s?|-\s)\s*(.+)$/);
  if (!m) m = line.match(/^(.+?)-(.+)$/);
  if (!m) return { en: line, sv: "", bad: true };
  return { en: m[1].trim(), sv: m[2].trim() };
}

// Card geometry shared by the preview and the PDF (mm). Cards fill the 180 x 267mm area inside the page margin.
const AREA_W = 180, AREA_H = 267, PAD_X = 7, PAD_Y = 9;
const LINE = 1.15;      // line height, in font sizes
const PT = 25.4 / 72;   // mm per point
// Where the text block's centre sits, as a share of the card height from the top: English in the middle,
// Swedish a third of the way up from the bottom.
const TEXT_Y = { en: 1 / 2, sv: 2 / 3 };
const SPACING = 0.08;   // extra space after each letter, in font sizes: a little air helps readers with dyslexia

// A word's width in mm including the letter spacing; widthOf(text, pt) measures it without.
const spacedWidth = (widthOf, text, pt) => widthOf(text, pt) + SPACING * pt * PT * [...text].length;

// Start at full size and shrink only until the text fits the card's safe area, so short words stay big.
// widthOf(text, pt) gives a line's width in mm. Returns the font size and the wrapped lines.
function fitText(text, cols, rows, widthOf, ty = 0.5) {
  const innerW = AREA_W / cols - 2 * PAD_X;
  const innerH = 2 * (AREA_H / rows * Math.min(ty, 1 - ty) - PAD_Y);
  const words = text.split(/\s+/);
  let pt = { 2: 26, 3: 20, 4: 15 }[cols], lines;
  for (;; pt -= 0.5) {
    lines = [];
    for (const w of words) {
      const last = lines.length - 1;
      if (last >= 0 && spacedWidth(widthOf, lines[last] + " " + w, pt) <= innerW) lines[last] += " " + w;
      else lines.push(w);
    }
    const widest = Math.max(...lines.map(l => spacedWidth(widthOf, l, pt)));
    if ((widest <= innerW && lines.length * pt * PT * LINE <= innerH) || pt <= 8) break;
  }
  return { pt, lines };
}

// On screen, measure with the same fonts the page shows.
const measureCtx = document.createElement("canvas").getContext("2d");
function screenWidth(text, pt) {
  measureCtx.font = `700 ${pt}pt ${getComputedStyle(document.body).getPropertyValue("--body")}`;
  return measureCtx.measureText(text).width * 25.4 / 96;
}
function screenWidthIPA(text, pt) {
  measureCtx.font = `400 ${pt}pt ${getComputedStyle(document.body).getPropertyValue("--ipa")}`;
  return measureCtx.measureText(text).width * 25.4 / 96;
}

// The pronunciation line sits just above the word, a bit smaller, shrunk further if it is too wide.
const IPA_GAP = 1.5; // mm between pronunciation and word (same as the .text gap)
function fitIPA(ipa, wordPt, cols, widthOf) {
  const innerW = AREA_W / cols - 2 * PAD_X;
  let pt = Math.max(8, wordPt * 0.65);
  while (pt > 6 && widthOf(ipa, pt) > innerW) pt -= 0.5;
  return pt;
}

// ---- Pronunciation: British (RP/UK) IPA from Wiktionary, only for one-word English cards.
// Answers are remembered in this browser, so each word is looked up once.
let ipaCache = {};
try { ipaCache = JSON.parse(load("ipa2") || "{}") || {}; } catch (e) {}
const ipaPending = new Map(); // word -> promise, so each word is asked for at most once per visit
const ipaQueue = [];
let ipaActive = 0, ipaRenderQueued = false;

const oneWord = en => /^[a-z]+(?:['’-][a-z]+)*$/i.test(en.trim());

function ipaFor(pair) {
  if (!$("showipa").checked || !oneWord(pair.en)) return "";
  const word = pair.en.trim().toLowerCase();
  if (word in ipaCache) return tidyIPA(ipaCache[word]);
  lookupIPA(word);
  return "";
}

function lookupIPA(word) {
  if (!ipaPending.has(word)) ipaPending.set(word, new Promise(resolve => { ipaQueue.push({ word, resolve }); pumpIPA(); }));
  return ipaPending.get(word);
}

// Two requests at a time: Wiktionary turns away clients that ask too fast.
function pumpIPA() {
  while (ipaActive < 2 && ipaQueue.length) {
    const { word, resolve } = ipaQueue.shift();
    ipaActive++;
    fetchIPA(word).then(ipa => {
      if (ipa !== null) { ipaCache[word] = ipa; store("ipa2", JSON.stringify(ipaCache)); }
      ipaActive--;
      resolve();
      pumpIPA();
      if (!ipaRenderQueued) { ipaRenderQueued = true; requestAnimationFrame(() => { ipaRenderQueued = false; render(); }); }
    });
  }
}

// Returns the IPA, "" when Wiktionary has no British pronunciation, or null when it could not be reached.
async function fetchIPA(word) {
  try {
    const url = "https://en.wiktionary.org/w/api.php?action=parse&prop=wikitext&format=json&formatversion=2&redirects=1&origin=*&page=" + encodeURIComponent(word);
    const data = await (await fetch(url, { signal: AbortSignal.timeout(10000) })).json();
    if (data.error) return data.error.code === "missingtitle" ? "" : null;
    return pickBritish(data.parse.wikitext);
  } catch (e) {
    return null;
  }
}

// Wiktionary writes pronunciations as {{IPA|en|/ˈpeɪvmənt/|a=RP,GA}}. Take the first one marked RP, UK or
// SSB (standard British), else one with no accent marked; never one marked only for another accent.
// When it lists a reduced form next to the full one (/ˈdeɪn.ʒə.rəs/ and /ˈdeɪn.d͡ʒə.rəs/), take the full one.
function pickBritish(wikitext) {
  const english = (wikitext.split("==English==")[1] || "").split(/\n==[^=]/)[0];
  const found = [...english.matchAll(/\{\{IPA\|en\|([^}]*)\}\}/g)].map(m => {
    const parts = m[1].split("|");
    const forms = parts.filter(x => /^\/.+\/$/.test(x));
    const full = forms.find(f => !forms.some(g => g !== f && g.replace(/d͡ʒ/g, "ʒ") === f));
    return { accent: (parts.find(x => x.startsWith("a=")) || "").slice(2), ipa: full };
  }).filter(x => x.ipa);
  const best = found.find(x => /\b(RP|UK|SSB)\b/.test(x.accent)) || found.find(x => !x.accent);
  return best ? tidyIPA(best.ipa) : "";
}

// Match the style of British learner dictionaries (Cambridge, Oxford): r instead of ɹ, eə and e instead of
// Wiktionary's newer ɛː and ɛ, optional sounds shown plainly, no tie bars. Safe to run twice.
const tidyIPA = ipa => ipa.replace(/ɹ/g, "r").replace(/ɛː/g, "eə").replace(/ɛ/g, "e").replace(/[()]/g, "").replace(/\u0361/g, "");

// Start any missing lookups and wait for them (at most 15 seconds), so the PDF gets them too.
async function ipaReady() {
  pairs.forEach(ipaFor);
  await Promise.race([Promise.all(ipaPending.values()), new Promise(r => setTimeout(r, 15000))]);
}

function cardHTML(pair, lang, setName, cols, rows) {
  if (!pair) return `<div class="card empty"></div>`;
  const { pt, lines } = fitText(pair[lang], cols, rows, screenWidth, TEXT_Y[lang]);
  const ipa = lang === "en" ? ipaFor(pair) : "";
  return `<div class="card">
    <div class="text" style="top:${TEXT_Y[lang] * 100}%">
      ${ipa ? `<span class="ipa" style="font-size:${fitIPA(ipa, pt, cols, screenWidthIPA)}pt">${esc(ipa)}</span>` : ""}
      <span class="word" style="font-size:${pt}pt">${lines.map(esc).join("<br>")}</span>
    </div>
    ${setName ? `<span class="tag set">${esc(setName)}</span>` : ""}
  </div>`;
}

let pairs = [];
// Every printed page in order (front 1, back 1, front 2, ...), each a list of grid slots
// { pair, lang } or null for an empty slot.
function sheetPages() {
  const per = +$("perpage").value;
  const [cols, rows] = LAYOUTS[per];
  const out = [];
  for (let p = 0; p * per < pairs.length; p++) {
    const chunk = pairs.slice(p * per, p * per + per);
    const front = [], back = [];
    for (let i = 0; i < per; i++) front.push(chunk[i] ? { pair: chunk[i], lang: "en" } : null);
    // The sheet is turned over sideways, so the back of the card at (r, c) sits in the same row, opposite column.
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const src = r * cols + (cols - 1 - c);
        back.push(chunk[src] ? { pair: chunk[src], lang: "sv" } : null);
      }
    }
    out.push(front, back);
  }
  return out;
}

function render() {
  pairs = $("words").value.split(/\r?\n/).map(parseLine).filter(Boolean);
  const per = +$("perpage").value;
  const [cols, rows] = LAYOUTS[per];
  const setName = $("setname").value.trim();

  const bad = pairs.filter(p => p.bad).length;
  const pages = Math.ceil(pairs.length / per) || 0;
  $("status").innerHTML = bad ? `<span class="warn">${bad} line${bad > 1 ? "s have" : " has"} no translation. Check the dash.</span>` : "";

  const gridStyle = `grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)`;
  let html = "";
  sheetPages().forEach((slots, i) => {
    const n = pages > 1 ? ` (sheet ${Math.floor(i / 2) + 1})` : "";
    html += `<div class="sheet-label">${i % 2 ? "Swedish" : "English"}${n}</div><section class="sheet"><div class="grid" style="${gridStyle}">` +
      slots.map(s => cardHTML(s && s.pair, s && s.lang, setName, cols, rows)).join("") + `</div></section>`;
  });
  $("preview").innerHTML = html;
}

["words", "setname", "perpage"].forEach(id => {
  const el = $(id);
  const saved = load(id);
  if (saved !== null) el.value = saved;
  el.addEventListener("input", () => { store(id, el.value); render(); });
});
const savedIPA = load("showipa");
if (savedIPA !== null) $("showipa").checked = savedIPA === "1";
$("showipa").addEventListener("change", () => { store("showipa", $("showipa").checked ? "1" : "0"); render(); });
if (!$("words").value.trim()) $("words").value = SAMPLE;
$("print").addEventListener("click", () => window.print());

// ---- PDF: words and cut lines are real text and lines (small file, prints fast). The 15mm margin is part of each page, so no print setting can move or shrink it.
const PAGE_W = 210, PAGE_H = 297, MARGIN = 15; // mm
const FONTS_URL = "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/";
const fontData = {};

// A font file as base64 for jsPDF, or "" if it can't be loaded.
async function loadFont(file, remote) {
  if (file in fontData) return fontData[file];
  try {
    const res = await fetchLocalFirst("vendor/" + file, FONTS_URL + remote);
    const buf = new Uint8Array(await res.arrayBuffer());
    let bin = "";
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
    fontData[file] = btoa(bin);
  } catch (e) {
    fontData[file] = "";
  }
  return fontData[file];
}

// Dashed cut lines around the filled slots. Each edge is drawn once: two overlapping dashed lines
// drift out of step and print as one solid line.
function pdfCutLines(doc, slots, cols, rows, w, h) {
  doc.setDrawColor(154, 165, 180);
  doc.setLineWidth(0.25);
  doc.setLineDashPattern([1.2, 1], 0);
  const filled = (r, c) => r >= 0 && r < rows && c >= 0 && c < cols && !!slots[r * cols + c];
  for (let r = 0; r <= rows; r++) for (let c = 0; c < cols; c++)
    if (filled(r - 1, c) || filled(r, c)) doc.line(MARGIN + c * w, MARGIN + r * h, MARGIN + (c + 1) * w, MARGIN + r * h);
  for (let c = 0; c <= cols; c++) for (let r = 0; r < rows; r++)
    if (filled(r, c - 1) || filled(r, c)) doc.line(MARGIN + c * w, MARGIN + r * h, MARGIN + c * w, MARGIN + (r + 1) * h);
}

function pdfCard(doc, font, ipaFont, slot, x, y, w, h, cols, rows, setName) {
  const { pair, lang } = slot;
  doc.setFont(font, "bold");
  const { pt, lines } = fitText(pair[lang], cols, rows, (t, size) => { doc.setFontSize(size); return doc.getTextWidth(t); }, TEXT_Y[lang]);
  doc.setFontSize(pt);
  const lineH = pt * PT * LINE;

  // Pronunciation (if any) and word form one block, centred at this side's TEXT_Y.
  const ipa = lang === "en" && ipaFont ? ipaFor(pair) : "";
  let ipaPt = 0;
  if (ipa) {
    doc.setFont(ipaFont, "normal");
    ipaPt = fitIPA(ipa, pt, cols, (t, size) => { doc.setFontSize(size); return doc.getTextWidth(t); });
  }
  const ipaH = ipa ? ipaPt * PT * LINE + IPA_GAP : 0;
  const top = y + h * TEXT_Y[lang] - (ipaH + lines.length * lineH) / 2;
  if (ipa) {
    doc.setFontSize(ipaPt);
    doc.setTextColor(107, 118, 134);
    doc.text(ipa, x + w / 2, top + ipaPt * PT * LINE / 2, { align: "center", baseline: "middle" });
  }

  const cy = top + ipaH;
  doc.setFont(font, "bold");
  doc.setFontSize(pt);
  doc.setTextColor(31, 42, 55);
  // Centred by hand, since jsPDF's own centring ignores the letter spacing.
  lines.forEach((l, i) => doc.text(l, x + (w - spacedWidth(t => doc.getTextWidth(t), l, pt)) / 2, cy + lineH * (i + 0.5),
    { baseline: "middle", charSpace: SPACING * pt * PT }));

  if (setName) {
    doc.setFont(font, "bold");
    doc.setFontSize(7);
    doc.setTextColor(107, 118, 134);
    doc.text(setName, x + w - 3, y + h - 2.5, { align: "right" });
  }
}

async function downloadPDF() {
  if (!pairs.length) return;
  if (!window.jspdf) { $("status").innerHTML = `<span class="warn">Could not load the PDF maker. Check the internet connection and reload the page.</span>`; return; }
  const btn = $("pdf");
  btn.disabled = true;
  btn.textContent = "Making PDF…";
  try {
    const doc = new jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
    // Without its own font the PDF falls back to built-in Helvetica, which has å, ä and ö but no phonetic
    // symbols, so pronunciations are left out then.
    const ttf = await loadFont("AtkinsonHyperlegible-Bold.ttf", "atkinsonhyperlegible/AtkinsonHyperlegible-Bold.ttf");
    let font = "helvetica", ipaFont = "";
    if (ttf) {
      doc.addFileToVFS("AtkinsonHyperlegible-Bold.ttf", ttf);
      doc.addFont("AtkinsonHyperlegible-Bold.ttf", "Atkinson", "bold");
      font = "Atkinson";
    }
    if ($("showipa").checked) {
      btn.textContent = "Looking up pronunciations…";
      await ipaReady();
      btn.textContent = "Making PDF…";
      const andika = await loadFont("Andika-Regular.ttf", "andika/Andika-Regular.ttf");
      if (andika) {
        doc.addFileToVFS("Andika-Regular.ttf", andika);
        doc.addFont("Andika-Regular.ttf", "Andika", "normal");
        ipaFont = "Andika";
      }
    }
    const [cols, rows] = LAYOUTS[+$("perpage").value];
    const setName = $("setname").value.trim();
    const w = (PAGE_W - 2 * MARGIN) / cols, h = (PAGE_H - 2 * MARGIN) / rows;
    sheetPages().forEach((slots, p) => {
      if (p) doc.addPage("a4", "portrait");
      pdfCutLines(doc, slots, cols, rows, w, h);
      slots.forEach((slot, i) => {
        if (slot) pdfCard(doc, font, ipaFont, slot, MARGIN + (i % cols) * w, MARGIN + Math.floor(i / cols) * h, w, h, cols, rows, setName);
      });
    });
    const name = (setName || "glosor").replace(/[^\p{L}\p{N} _-]/gu, "").trim().replace(/\s+/g, "-");
    doc.save(`flipcards-${name}.pdf`);
  } finally {
    btn.disabled = false;
    btn.textContent = "Download PDF";
  }
}
$("pdf").addEventListener("click", downloadPDF);

render();
document.fonts.ready.then(render); // measure again once the web fonts have loaded
</script>
