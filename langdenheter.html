<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omvandla längdenheter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
/* One A4 folded in half to A5 (top half front, bottom half back): one colour per unit, units in a list so µm/nm can be added later */
:root {
  --bg: #ffffff;
  --ink: #1b2233;
  --muted: #5f6879;
  --line: #d3d8e2;
  --soft: #e6e9f0;
  --unit: #7d8594;
  --m: #1d5bbf;
  --dm: #0d8165;
  --cm: #b36d00;
  --mm: #b02f68;
  --km: #7a3fbf;
  --mil: #5c6b00;
  --comma: #d4281c;
  --display: "Andika", "Segoe UI", system-ui, sans-serif;
  --body: "Andika", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161f; --ink: #e8ecf3; --muted: #9aa3b4; --line: #333b4b; --soft: #232a38; --unit: #8892a3;
    --m: #78a8ff; --dm: #4fd1ad; --cm: #f2b24d; --mm: #f080b2; --km: #c29bff; --mil: #b9cc4a; --comma: #ff6b5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161f; --ink: #e8ecf3; --muted: #9aa3b4; --line: #333b4b; --soft: #232a38; --unit: #8892a3;
  --m: #78a8ff; --dm: #4fd1ad; --cm: #f2b24d; --mm: #f080b2; --km: #c29bff; --mil: #b9cc4a; --comma: #ff6b5e;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--body);
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet { max-width: 186mm; margin: 0 auto; display: grid; gap: 26px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.lead { color: var(--muted); margin-top: 4px; }
section { display: grid; gap: 10px; break-inside: avoid; }
.side { display: grid; gap: 26px; align-content: start; }
.home { color: var(--muted); font-size: 0.9rem; }
.sign { width: 160px; justify-self: center; }

.u-m { color: var(--m); } .u-dm { color: var(--dm); } .u-cm { color: var(--cm); } .u-mm { color: var(--mm); } .u-km { color: var(--km); } .u-mil { color: var(--mil); }
.unit { font-weight: 400; }

/* Unit boxes as the table's header, one over each column, with the step between columns on the border */
.conv thead th { background: none; border: none; padding: 0 36px 10px; position: relative; width: 16.66%; }
.box {
  display: inline-block; min-width: 2.2em; text-align: center;
  border: 2px solid currentColor; border-radius: 6px; padding: 6px 8px;
}
.box b { display: block; font-family: var(--display); font-size: 1.6rem; line-height: 1; }
.arrow {
  position: absolute; z-index: 1; top: 0; bottom: 10px; right: 0; transform: translateX(50%);
  display: grid; align-content: center; gap: 4px;
  text-align: center; font-family: var(--body); font-weight: 700; font-size: 0.8rem; font-variant-numeric: tabular-nums;
}
.arrow .down { color: var(--ink); }
.arrow .up { color: var(--muted); }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
.rules p { padding-left: 10px; border-left: 3px solid var(--line); }

/* Tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: right; white-space: nowrap; }
th { font-family: var(--display); font-size: 1.05rem; background: var(--soft); text-align: center; }
.conv td { font-size: 1.1rem; }
.conv td .unit { font-size: 0.95rem; color: var(--unit); }
.conv td.one { background: var(--soft); font-weight: 700; }

@media (max-width: 560px) {
  h1 { font-size: 1.7rem; }
  .arrow { font-size: 0.7rem; }
  .box b { font-size: 1.3rem; }
  .rules { grid-template-columns: 1fr; }
  th, td { padding: 6px 6px; }
  .conv td { font-size: 0.95rem; }
}

@media print {
  :root, :root[data-theme="dark"] {
    --bg: #fff; --ink: #000; --muted: #444; --line: #bbb; --soft: #e2e5ec; --unit: #777;
    --m: #1d5bbf; --dm: #0d8165; --cm: #a86400; --mm: #b02f68; --km: #7a3fbf; --mil: #5c6b00; --comma: #d4281c;
    color-scheme: light;
  }
  @page { size: A4; margin: 0; }
  body { margin: 0; padding: 0; font-size: 10pt; }
  .sheet { max-width: none; gap: 0; }
  .side {
    height: 148.5mm; box-sizing: border-box; overflow: hidden;
    padding: 10mm 25mm; gap: 5mm; align-content: center;
  }
  h1 { font-size: 20pt; }
  h2 { font-size: 12pt; }
  .box { padding: 3px 5px; min-width: 1.6em; }
  .box b { font-size: 13pt; }
  .arrow { font-size: 7.5pt; gap: 2px; bottom: 3mm; }
  th, td { padding: 4px 6px; }
  .conv th, .conv td { padding: 4px 4px; }
  .conv td { font-size: 10pt; }
  .conv td .unit { font-size: 9pt; }
  .conv thead th { padding: 0 0 3mm; }

  .home { display: none; }
  .sign { width: 30mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<main class="sheet">
  <a class="home" href="index.html">← Alla verktyg</a>
  <div class="side">

  <section>
    <div class="scroll"><table class="conv" id="conv"></table></div>
  </section>

  <img class="sign" src="glhf-ola.png" alt="GLHF, Ola">
  </div>
</main>

<script>
// Each unit's size in millimetres. Add µm or nm here later.
const UNITS = [
  { u: "mil", name: "mil",       mm: 10000000 },
  { u: "km",  name: "kilometer", mm: 1000000 },
  { u: "m",  name: "meter",      mm: 1000 },
  { u: "dm", name: "decimeter",  mm: 100 },
  { u: "cm", name: "centimeter", mm: 10 },
  { u: "mm", name: "millimeter", mm: 1 },
];
const ROWS_MM = [10000000, 1000000, 10000, 1000, 5000, 100, 10, 1];

// Decimal comma; four digits or more get thin-space groups of three, counted from the comma (1 000, 0,000 1)
const fmt = x => {
  const [int, dec] = x.toFixed(8).replace(/\.?0+$/, "").split(".");
  const g = int.length > 3 ? int.replace(/\B(?=(\d{3})+$)/g, "\u202f") : int;
  const d = dec && dec.length > 3 ? dec.replace(/(\d{3})(?=\d)/g, "$1\u202f") : dec;
  return d ? `${g},${d}` : g;
};
const unit = u => ` <span class="unit u-${u}">${u}</span>`;

document.getElementById("conv").innerHTML =
  `<thead><tr>${UNITS.map((x, i) => `<th>` +
    `<div class="box u-${x.u}"><b>${x.u}</b></div>` +
    (i < UNITS.length - 1 ? `<div class="arrow"><span class="down">×${x.mm / UNITS[i + 1].mm} →</span><span class="up">← ÷${x.mm / UNITS[i + 1].mm}</span></div>` : "") +
    `</th>`).join("")}</tr></thead>` +
  `<tbody>${ROWS_MM.map(v => `<tr>${UNITS.map(x => {
    const n = v / x.mm;
    return `<td${n === 1 ? ' class="one"' : ""}>${fmt(n)}${unit(x.u)}</td>`;
  }).join("")}</tr>`).join("")}</tbody>`;

</script>
</body>
</html>
